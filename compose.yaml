services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deepfine_inventory
      POSTGRES_USER: deepfine
      POSTGRES_PASSWORD: deepfine
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfine -d deepfine_inventory"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
